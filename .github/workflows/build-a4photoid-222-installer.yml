name: Build A4 PhotoID 2.2.2 Installer

on:
  workflow_dispatch:
  push:
    branches:
      - a4photoid-v07-build
    paths:
      - '.github/workflows/build-a4photoid-222-installer.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Pack reconstructed 2.2 source
        shell: powershell
        run: |
          if (Test-Path '.\A4PhotoID_2.2_source.zip') { Remove-Item '.\A4PhotoID_2.2_source.zip' -Force }
          Compress-Archive -Path '.\buildsrc\A4PhotoID\*' -DestinationPath '.\A4PhotoID_2.2_source.zip' -CompressionLevel Optimal

      - name: Upload reconstructed 2.2 source
        uses: actions/upload-artifact@v4
        with:
          name: A4PhotoID-2.2.2-Source
          path: A4PhotoID_2.2_source.zip
          if-no-files-found: error

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Rebuild A4 PhotoID 2.2 source
        shell: powershell
        run: |
          $b64=[regex]::Replace((Get-Content '.\v22\build22.ps1.gz.b64' -Raw),'\s','')
          [IO.File]::WriteAllBytes('.\build22.ps1.gz',[Convert]::FromBase64String($b64))
          $i=[IO.File]::OpenRead('.\build22.ps1.gz')
          try {
            $g=New-Object IO.Compression.GzipStream($i,[IO.Compression.CompressionMode]::Decompress)
            try {
              $o=[IO.File]::Create('.\build22.ps1')
              try {$g.CopyTo($o)} finally {$o.Dispose()}
            } finally {$g.Dispose()}
          } finally {$i.Dispose()}
          .\build22.ps1

      - name: Apply stable 2.2.2 installer fix
        shell: powershell
        run: |
          $root = '.\buildsrc\A4PhotoID'

          $csproj = Join-Path $root 'src\A4PhotoID\A4PhotoID.csproj'
          $text = Get-Content $csproj -Raw
          $text = $text.Replace('<Version>2.2.0</Version>','<Version>2.2.2</Version>')
          $text = $text.Replace('<AssemblyVersion>2.2.0.0</AssemblyVersion>','<AssemblyVersion>2.2.2.0</AssemblyVersion>')
          $text = $text.Replace('<FileVersion>2.2.0.0</FileVersion>','<FileVersion>2.2.2.0</FileVersion>')
          Set-Content -Path $csproj -Value $text -Encoding UTF8

          $nsi = Join-Path $root 'installer\A4PhotoID.nsi'
          $nsiText = [System.IO.File]::ReadAllText($nsi, (New-Object System.Text.UTF8Encoding($false)))
          $nsiText = $nsiText.Replace('!define APP_VERSION "2.2.0"','!define APP_VERSION "2.2.2"')

          # Do not start camera/application from inside the elevated installer finish page.
          $nsiText = [regex]::Replace($nsiText, '(?m)^!define MUI_FINISHPAGE_RUN .*\r?\n', '')
          $nsiText = [regex]::Replace($nsiText, '(?m)^!define MUI_FINISHPAGE_RUN_TEXT .*\r?\n', '')

          # Close a previously running A4PhotoID before replacing self-contained files.
          $newInitLines = @(
            'Function .onInit',
            '    ${IfNot} ${RunningX64}',
            '        MessageBox MB_ICONSTOP "A4 PhotoID requires 64-bit Windows."',
            '        Abort',
            '    ${EndIf}',
            '',
            '    nsExec::Exec ''"$SYSDIR\taskkill.exe" /F /T /IM A4PhotoID.exe''',
            '    Pop $$0',
            '    Sleep 700',
            'FunctionEnd'
          )
          $newInit = $newInitLines -join "`r`n"
          $nsiText = [regex]::Replace($nsiText, '(?s)Function \.onInit.*?FunctionEnd', $newInit)

          if ($nsiText -notmatch '(?m)^SetOverwrite on$') {
            $nsiText = $nsiText.Replace('SetCompressor /SOLID lzma', "SetCompressor /SOLID lzma`r`nSetOverwrite on")
          }
          [System.IO.File]::WriteAllText($nsi, $nsiText, (New-Object System.Text.UTF8Encoding($true)))

          $build = Join-Path $root 'build-installer.ps1'
          $buildText = Get-Content $build -Raw
          $buildText = $buildText.Replace('A4PhotoID_Setup_2.2.0_win-x64.exe','A4PhotoID_Setup_2.2.2_win-x64.exe')
          Set-Content -Path $build -Value $buildText -Encoding UTF8

          Remove-Item (Join-Path $root 'dist\A4PhotoID_Setup_2.2.0_win-x64.exe') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $root 'dist\A4PhotoID_Setup_2.2.1_win-x64.exe') -Force -ErrorAction SilentlyContinue
          & $build

      - name: Verify installer
        shell: powershell
        run: |
          $installer = '.\buildsrc\A4PhotoID\dist\A4PhotoID_Setup_2.2.2_win-x64.exe'
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $item = Get-Item $installer
          if ($item.Length -lt 1000000) { throw "Installer is unexpectedly small: $($item.Length) bytes" }
          Get-FileHash $installer -Algorithm SHA256 | Format-List
          Write-Host "Installer size: $($item.Length) bytes"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: A4PhotoID-2.2.2-Windows-Installer
          path: buildsrc\A4PhotoID\dist\A4PhotoID_Setup_2.2.2_win-x64.exe
          if-no-files-found: error
