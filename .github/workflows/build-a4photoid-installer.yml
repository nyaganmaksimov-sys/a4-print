name: Build A4 PhotoID Installer

on:
  push:
    branches:
      - a4photoid-installer-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source archive
        shell: powershell
        run: |
          $chunks = @()
          for ($i = 0; $i -lt 8; $i++) {
            if ($i -eq 5) {
              $fixed = (Get-ChildItem .\p05fix.*.txt | Sort-Object Name | ForEach-Object { Get-Content $_ -Raw }) -join ''
              if ($fixed.Length -ne 16497) { throw "part05 repair length is $($fixed.Length), expected 16497" }
              $chunks += $fixed
            } else {
              $chunks += Get-Content ('.\a4photoid-src.part{0:D2}.b64' -f $i) -Raw
            }
          }
          $b64 = $chunks -join ''
          if ($b64.Length -ne 131972) { throw "combined Base64 length is $($b64.Length), expected 131972" }
          [IO.File]::WriteAllBytes('.\A4PhotoID_0.6_source.zip',[Convert]::FromBase64String($b64))
          Expand-Archive -Path .\A4PhotoID_0.6_source.zip -DestinationPath .\buildsrc -Force
          Write-Host "Source archive restored successfully"
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress
      - name: Build installer
        shell: powershell
        run: .\buildsrc\A4PhotoID\build-installer.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: A4PhotoID-Windows-Installer
          path: buildsrc\A4PhotoID\dist\A4PhotoID_Setup_0.6.0_win-x64.exe
          if-no-files-found: error
