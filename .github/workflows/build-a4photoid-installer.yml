name: Build A4 PhotoID 0.7.1 Installer

on:
  push:
    branches:
      - a4photoid-v07-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild A4 PhotoID 0.6 baseline
        shell: powershell
        run: |
          $chunks = @()
          for ($i = 0; $i -lt 8; $i++) {
            if ($i -eq 5) {
              $fixed = (Get-ChildItem .\p05fix.*.txt | Sort-Object Name | ForEach-Object { Get-Content $_ -Raw }) -join ''
              if ($fixed.Length -ne 16497) { throw "part05 repair length is $($fixed.Length), expected 16497" }
              $chunks += $fixed
            } else {
              $chunks += Get-Content ('.\a4photoid-src.part{0:D2}.b64' -f $i) -Raw
            }
          }
          $b64 = $chunks -join ''
          if ($b64.Length -ne 131972) { throw "combined Base64 length is $($b64.Length), expected 131972" }
          [IO.File]::WriteAllBytes('.\A4PhotoID_0.6_source.zip',[Convert]::FromBase64String($b64))
          Expand-Archive -Path .\A4PhotoID_0.6_source.zip -DestinationPath .\buildsrc -Force
          Write-Host "A4 PhotoID 0.6 baseline restored"

      - name: Apply baseline compile fixes
        shell: powershell
        run: |
          $root = '.\buildsrc\A4PhotoID\src\A4PhotoID'
          $face = Join-Path $root 'Services\WindowsFaceDetectionService.cs'
          $text = Get-Content $face -Raw
          $text = $text.Replace('var decoder = await BitmapDecoder.CreateAsync(stream);','var decoder = await Windows.Graphics.Imaging.BitmapDecoder.CreateAsync(stream);')
          $text = $text.Replace('encoder.Frames.Add(BitmapFrame.Create(source));','encoder.Frames.Add(System.Windows.Media.Imaging.BitmapFrame.Create(source));')
          Set-Content -Path $face -Value $text -Encoding UTF8

          foreach ($rel in @('Services\JobHistoryService.cs','Services\DocumentTemplateRepository.cs','ViewModels\MainViewModel.cs')) {
            $path = Join-Path $root $rel
            $src = Get-Content $path -Raw
            if (-not $src.StartsWith('using System.IO;')) {
              $src = "using System.IO;`r`n" + $src
              Set-Content -Path $path -Value $src -Encoding UTF8
            }
          }

          $installerScript = '.\buildsrc\A4PhotoID\build-installer.ps1'
          $script = Get-Content $installerScript -Raw
          $script = $script.Replace('$makensis = $possible[0]', '$makensis = if ($possible -is [array]) { $possible[0] } else { $possible }')
          Set-Content -Path $installerScript -Value $script -Encoding UTF8

      - name: Rebuild and apply A4 PhotoID 0.7 patch
        shell: powershell
        run: |
          $patchParts = @(
            '.\v07\patch.part00.b64',
            '.\v07\p01fix00.b64',
            '.\v07\p01fix01.b64',
            '.\v07\p01fix02.b64',
            '.\v07\p01fix03.b64',
            '.\v07\p01fix04.b64',
            '.\v07\gp02.b64',
            '.\v07\gp03.b64',
            '.\v07\p04fix00.b64',
            '.\v07\p04fix01.b64',
            '.\v07\p04fix02.b64',
            '.\v07\p04fix03.b64',
            '.\v07\gp05.b64'
          )
          $patchB64 = ($patchParts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          if ($patchB64.Length -ne 24612) { throw "0.7 patch Base64 length is $($patchB64.Length), expected 24612" }

          [IO.File]::WriteAllBytes('.\v07.patch.gz', [Convert]::FromBase64String($patchB64))
          $input = [IO.File]::OpenRead('.\v07.patch.gz')
          try {
            $gzip = New-Object IO.Compression.GzipStream($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create('.\v07.patch')
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }

          git apply --check --directory=buildsrc/A4PhotoID .\v07.patch
          if ($LASTEXITCODE -ne 0) { throw 'git apply --check failed' }
          git apply --whitespace=nowarn --directory=buildsrc/A4PhotoID .\v07.patch
          if ($LASTEXITCODE -ne 0) { throw 'git apply failed' }

          $projectText = Get-Content '.\buildsrc\A4PhotoID\src\A4PhotoID\A4PhotoID.csproj' -Raw
          if (-not $projectText.Contains('<Version>0.7.0</Version>')) {
            Write-Host $projectText
            throw 'A4 PhotoID 0.7 patch did not update the restored project'
          }
          Write-Host "A4 PhotoID 0.7 patch applied inside restored project"

      - name: Apply A4 PhotoID 0.7.1 stabilization patch
        shell: powershell
        run: |
          $stabilizationB64 = ((Get-Content '.\v071\stab00.b64' -Raw) + (Get-Content '.\v071\stab01.b64' -Raw)) -replace '\s',''
          if ($stabilizationB64.Length -ne 8812) { throw "0.7.1 stabilization Base64 length is $($stabilizationB64.Length), expected 8812" }

          [IO.File]::WriteAllBytes('.\v071.patch.gz', [Convert]::FromBase64String($stabilizationB64))
          $input = [IO.File]::OpenRead('.\v071.patch.gz')
          try {
            $gzip = New-Object IO.Compression.GzipStream($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create('.\v071.patch')
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }

          git apply --check --directory=buildsrc/A4PhotoID .\v071.patch
          if ($LASTEXITCODE -ne 0) { throw '0.7.1 git apply --check failed' }
          git apply --whitespace=nowarn --directory=buildsrc/A4PhotoID .\v071.patch
          if ($LASTEXITCODE -ne 0) { throw '0.7.1 git apply failed' }

          $projectText = Get-Content '.\buildsrc\A4PhotoID\src\A4PhotoID\A4PhotoID.csproj' -Raw
          if (-not $projectText.Contains('<Version>0.7.1</Version>')) {
            Write-Host $projectText
            throw 'A4 PhotoID 0.7.1 patch did not update the restored project'
          }
          Write-Host "A4 PhotoID 0.7.1 stabilization patch applied"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Build A4 PhotoID 0.7.1 installer
        shell: powershell
        run: .\buildsrc\A4PhotoID\build-installer.ps1

      - name: Verify installer
        shell: powershell
        run: |
          $installer = '.\buildsrc\A4PhotoID\dist\A4PhotoID_Setup_0.7.1_win-x64.exe'
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $item = Get-Item $installer
          if ($item.Length -lt 1000000) { throw "Installer is unexpectedly small: $($item.Length) bytes" }
          Get-FileHash $installer -Algorithm SHA256 | Format-List
          Write-Host "Installer size: $($item.Length) bytes"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: A4PhotoID-0.7.1-Windows-Installer
          path: buildsrc\A4PhotoID\dist\A4PhotoID_Setup_0.7.1_win-x64.exe
          if-no-files-found: error
