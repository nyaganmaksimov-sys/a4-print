name: Build A4 PhotoID 2.2.1 Installer

on:
  workflow_dispatch:
  push:
    branches:
      - a4photoid-v07-build
    paths:
      - '.github/workflows/build-a4photoid-221-installer.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Rebuild A4 PhotoID 2.2 source
        shell: powershell
        run: |
          $b64=[regex]::Replace((Get-Content '.\v22\build22.ps1.gz.b64' -Raw),'\s','')
          [IO.File]::WriteAllBytes('.\build22.ps1.gz',[Convert]::FromBase64String($b64))
          $i=[IO.File]::OpenRead('.\build22.ps1.gz')
          try {
            $g=New-Object IO.Compression.GzipStream($i,[IO.Compression.CompressionMode]::Decompress)
            try {
              $o=[IO.File]::Create('.\build22.ps1')
              try {$g.CopyTo($o)} finally {$o.Dispose()}
            } finally {$g.Dispose()}
          } finally {$i.Dispose()}
          .\build22.ps1

      - name: Apply 2.2.1 installer encoding fix
        shell: powershell
        run: |
          $root = '.\buildsrc\A4PhotoID'

          $csproj = Join-Path $root 'src\A4PhotoID\A4PhotoID.csproj'
          $text = Get-Content $csproj -Raw
          $text = $text.Replace('<Version>2.2.0</Version>','<Version>2.2.1</Version>')
          $text = $text.Replace('<AssemblyVersion>2.2.0.0</AssemblyVersion>','<AssemblyVersion>2.2.1.0</AssemblyVersion>')
          $text = $text.Replace('<FileVersion>2.2.0.0</FileVersion>','<FileVersion>2.2.1.0</FileVersion>')
          Set-Content -Path $csproj -Value $text -Encoding UTF8

          $nsi = Join-Path $root 'installer\A4PhotoID.nsi'
          $nsiText = [System.IO.File]::ReadAllText($nsi, (New-Object System.Text.UTF8Encoding($false)))
          $nsiText = $nsiText.Replace('!define APP_VERSION "2.2.0"','!define APP_VERSION "2.2.1"')
          # NSIS needs the UTF-8 BOM here; otherwise literal Cyrillic is decoded through ANSI
          # and "Запустить A4 PhotoID" becomes mojibake on the Finish page.
          [System.IO.File]::WriteAllText($nsi, $nsiText, (New-Object System.Text.UTF8Encoding($true)))

          $bytes = [System.IO.File]::ReadAllBytes($nsi)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw 'A4PhotoID.nsi is missing the UTF-8 BOM'
          }

          $build = Join-Path $root 'build-installer.ps1'
          $buildText = Get-Content $build -Raw
          $buildText = $buildText.Replace('A4PhotoID_Setup_2.2.0_win-x64.exe','A4PhotoID_Setup_2.2.1_win-x64.exe')
          Set-Content -Path $build -Value $buildText -Encoding UTF8

          Remove-Item (Join-Path $root 'dist\A4PhotoID_Setup_2.2.0_win-x64.exe') -Force -ErrorAction SilentlyContinue
          & $build

      - name: Verify installer
        shell: powershell
        run: |
          $installer = '.\buildsrc\A4PhotoID\dist\A4PhotoID_Setup_2.2.1_win-x64.exe'
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $item = Get-Item $installer
          if ($item.Length -lt 1000000) { throw "Installer is unexpectedly small: $($item.Length) bytes" }
          Get-FileHash $installer -Algorithm SHA256 | Format-List
          Write-Host "Installer size: $($item.Length) bytes"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: A4PhotoID-2.2.1-Windows-Installer
          path: buildsrc\A4PhotoID\dist\A4PhotoID_Setup_2.2.1_win-x64.exe
          if-no-files-found: error
